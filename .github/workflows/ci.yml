name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  test:
    name: Tests & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tests with coverage (thresholds 85%)
        run: pnpm test:coverage
      - name: Coverage summary
        if: always()
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const rows = ["lines","statements","functions","branches"].map(k => `| ${k} | ${t[k].pct}% |`);
            console.log(["| metric | coverage |","| --- | --- |", ...rows].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info

  build:
    name: Build, package & Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Check package contents (not published)
        run: npm pack --dry-run
      - name: Load the ESM and CJS builds
        run: |
          node -e 'const m = require("./dist/index.cjs"); if (!m.isValidRuc("80000001-3")) process.exit(1)'
          node --input-type=module -e 'import { buildCdc } from "./dist/index.js"; if (typeof buildCdc !== "function") process.exit(1)'
      - name: Docker image smoke test
        run: |
          docker build -t sifen-toolkit:ci .
          docker run -d --name sifen -p 3000:3000 sifen-toolkit:ci
          for i in $(seq 1 30); do curl -fsS localhost:3000/health && break; sleep 1; done
          curl -fsS localhost:3000/docs/json > /dev/null
          docker rm -f sifen

  xsd:
    name: Validate against official XSDs (informational)
    runs-on: ubuntu-latest
    # Depends on an external SET website; never blocks the pipeline.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: pnpm xsd:download
      - name: Validate sample invoice
        run: |
          set -o pipefail
          if ! pnpm xsd:validate 2>&1 | tee xsd.log; then
            # Surface schema errors as annotations (visible without downloading logs).
            grep -E "error|fails to validate|Schemas validity" xsd.log | head -10 | while read -r line; do
              echo "::error title=XSD::${line}"
            done
            exit 1
          fi
